  model_finder: MFP
  model_set: LG,WAG,JTT
  ufboot_replicates: 1000
  sh_alrt_replicates: 0
  bnni: true
  max_iterations: 10000
  stop_generations: 200
  likelihood_epsilon: 0.001
  minimum_sequences: 4
  minimum_trimmed_sites: 50
  timeout_seconds: 86400
