  generax_mpi_ranks: 16
alignment:
  executable: /absolute/path/tools/anaconda3/envs/cs_gene_tree/bin/mafft
  algorithm: E-INS-i
  genafpair: true
  maxiterate: 10000
  timeout_seconds: 86400
trimming:
  executable: /absolute/path/tools/anaconda3/envs/cs_gene_tree/bin/clipkit
  mode: kpic-gappy
  gap_threshold: 0.7
  minimum_non_gap_aa_per_sequence: 1
  preserve_native_clipkit_output: true
  remove_all_gap_after_clipkit: true
  all_gap_definition: non_gap_aa_eq_0
  downstream_alignment_suffix: .clipkit.aln.faa
  minimum_retained_site_fraction: 0.0
  timeout_seconds: 86400
tree:
