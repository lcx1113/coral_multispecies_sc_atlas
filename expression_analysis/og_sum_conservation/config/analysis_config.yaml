project:
  name: og_sum_conservation
  root: "."
  seed: 260818

inputs:
  species_manifest: config/species_manifest.tsv
  celltype_comparisons: config/celltype_comparisons.tsv
  gene_og_mapping: inputs/all_species.seurat_gene_og.tsv.gz
  broccoli_gene_to_og: ../../gene_annotation/orthogroup_inference/reference_results/Anthozoa/orthogroup_conservation.csv
  og_annotations: ../../gene_annotation/functional_annotation/reference_results/orthogroups/orthogroup_final_annotations.csv

seurat:
  assay: RNA
  counts_layer: counts
  celltype_column: cell_type

aggregation:
  method: OG_SUM
  multi_og_gene_weight: 1.0
  calculate_og_mean: false
  calculate_og_max: false

normalization:
  method: LogNormalize
  scale_factor: 10000

markers:
  test_use: wilcox
  slot: data
  fc_slot: data
  min_pct_for_test: 0.05
  logfc_threshold_for_test: 0.0
  only_pos_for_test: false
  filtered_avg_log2fc_gt: 0.25
  filtered_pct_target_gt: 0.05
  filtered_p_val_adj_lt: 0.05
  include_unknown_in_background: true
  cell_cap: null

conservation:
  core_fraction: 1.0
  broad_fraction: 0.75
  majority_fraction: 0.5
  shared_min_species: 2
  heatmap_candidate_set: broad_including_core
  heatmap_missing_value: NA
  heatmap_scale_rows: false
  heatmap_cluster_rows: true
  heatmap_cluster_columns: false

log2fc_all_celltypes:
  included_in_main_pipeline: false
  source_object_dir: intermediate/02_og_sum_objects
  output_dir: results/LOG2FC
  assay: OG_SUM
  counts_layer: counts
  data_layer: data
  celltype_column: cell_type
  target_mode: each_observed_label_separately
  exclude_target_regex: "^(unknown|undefined)"
  exclude_target_regex_ignore_case: true
  excluded_labels_remain_in_background: true
  merge_target_labels: false
  explicit_separate_labels:
    Hcoe:
      - calicoblast
      - calicoblast-like
  features: all_og_with_positive_species_total
  test_use: wilcox
  slot: data
  fc_slot: data
  min_pct: 0.0
  min_diff_pct: -.inf
  logfc_threshold: 0.0
  only_pos: false
  min_cells_feature: 1
  min_cells_group: 3
  max_cells_per_ident: .inf
  cell_cap: null
  fold_change_base: 2
  fold_change_pseudocount: 1
  full_table_compression: tsv.gz
  matrix_compression: tsv.gz
  missing_test_value: NA

downregulated_og:
  included_in_main_pipeline: false
  run_after_main_pipeline: true
  source_marker_subdir: markers/full
  output_subdir: downregulated
  avg_log2fc_lt: -0.25
  pct_background_gt: 0.05
  p_val_adj_lt: 0.05
  filtered_table_compression: tsv
  conservation_table_compression: tsv
  add_final_annotation_version: true
  final_annotation_priority:
    - first_annotation
    - second_annotation

outputs:
  intermediate_dir: intermediate
  comparisons_dir: results/comparisons
  logs_dir: logs
  full_marker_compression: tsv.gz
  filtered_marker_compression: tsv
  human_review_compression: tsv
